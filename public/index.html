<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌪️ CI-Drift v1.5.0 — Digital Twin Dashboard</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border: #30363d;
            --text: #c9d1d9;
            --cyan: #58a6ff;
            --green: #3fb950;
            --purple: #bc8cff;
            --yellow: #d29922;
            --red: #f85149;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
            margin-bottom: 35px;
        }
        .title {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .badge {
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.2), rgba(188, 140, 255, 0.2));
            color: var(--cyan);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(88, 166, 255, 0.4);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 35px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .card h3 {
            margin-top: 0;
            font-size: 13px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card .stat {
            font-size: 36px;
            font-weight: 800;
            color: #fff;
            margin-top: 8px;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--green);
            font-weight: 600;
            background: rgba(63, 185, 80, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(63, 185, 80, 0.3);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        th, td {
            padding: 16px 22px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: rgba(33, 38, 45, 0.9);
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">
            <span>🌪️ CI-Drift v1.5.0</span>
            <span class="badge">VelociRadix Engine</span>
        </div>
        <div class="status-pill">
            <span class="status-dot"></span>
            <span>Digital Twin Active (0.00ms Drift)</span>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Remote CI Minutes Saved</h3>
            <div class="stat" style="color: var(--green);">420+ Mins</div>
        </div>
        <div class="card">
            <h3>Estimated Cost Saved</h3>
            <div class="stat" style="color: var(--cyan);">$84.00 USD</div>
        </div>
        <div class="card">
            <h3>Static Drift Guards</h3>
            <div class="stat" style="color: var(--purple);">15 Guards</div>
        </div>
        <div class="card">
            <h3>Simulated Engine</h3>
            <div class="stat" style="color: var(--yellow);">VelociRadix HTTP</div>
        </div>
    </div>

    <h2 style="font-size: 20px; margin-bottom: 16px;">📋 Monitored Local Workflows</h2>
    <div id="workflows-table">
        <p style="color: #8b949e;">Loading active workflows data from VelociRadix API...</p>
    </div>

    <script>
        fetch('/api/status')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('workflows-table');
                if (data.workflows && data.workflows.length > 0) {
                    let rows = data.workflows.map(w => `
                        <tr>
                            <td><strong>${w.name}</strong></td>
                            <td><code style="color: var(--cyan);">${w.file}</code></td>
                            <td>${w.jobsCount} Job(s)</td>
                            <td><code>${w.triggers}</code></td>
                            <td><span style="color: var(--green); font-weight: 600;">✔ Verified</span></td>
                        </tr>
                    `).join('');
                    container.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Workflow Name</th>
                                    <th>File Location</th>
                                    <th>Jobs</th>
                                    <th>Triggers</th>
                                    <th>Pre-flight Audit</th>
                                </tr>
                            </thead>
                            <tbody>\${rows}</tbody>
                        </table>
                    `;
                } else {
                    container.innerHTML = '<p style="color: var(--yellow);">No active workflows found in .github/workflows</p>';
                }
            })
            .catch(err => {
                document.getElementById('workflows-table').innerHTML = '<p style="color: var(--red);">Failed to load API status from VelociRadix engine.</p>';
            });
    </script>
</body>
</html>
