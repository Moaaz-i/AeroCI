name: Publish to NPM

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Check NPM Registry & Publish
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view aeroci@$LOCAL_VER version 2>/dev/null || true)
          
          if [ "$REMOTE_VER" = "$LOCAL_VER" ]; then
            echo "::notice::Version aeroci@$LOCAL_VER is already published on npm. Skipping."
          else
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "::error::NPM_TOKEN secret is missing in GitHub repository settings! Please add NPM_TOKEN to Repository Secrets."
              exit 1
            fi
            echo "New version detected! Publishing aeroci@$LOCAL_VER to npm..."
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
